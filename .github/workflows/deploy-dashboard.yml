name: Deploy dashboard (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - "teams-eye-contact-coach/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teams-eye-contact-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teams-eye-contact-coach/package-lock.json

      # Install only what the dashboard needs, from the lock file.
      - run: npm ci --workspace dashboard --include-workspace-root=false

      - run: npm test --workspace dashboard

      # The VITE_* values are public client configuration (IDs and URLs), not secrets.
      - name: Build
        run: npm run build --workspace dashboard
        env:
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_DASHBOARD_CLIENT_ID: ${{ vars.DASHBOARD_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      # The only secret: the Static Web Apps deployment token, stored in GitHub secrets.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: teams-eye-contact-coach/dashboard/dist
          skip_app_build: true
          skip_api_build: true
