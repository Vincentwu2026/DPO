[project]
name = "teams-eye-contact-coach-tracker"
version = "0.1.0"
description = "MediaPipe gaze tracker side-process for Teams Eye Contact Coach"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.2.3",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.5",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
