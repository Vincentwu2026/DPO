<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye Contact HUD</title>
    <link rel="stylesheet" href="./hud.css" />
  </head>
  <body>
    <div id="hud" class="hud" data-zone="none">
      <div id="grip" class="grip" title="Drag to move" aria-label="Move HUD">
        <span class="grip-dots" aria-hidden="true"></span>
        <div class="grip-actions">
          <button
            id="mute"
            class="icon-btn"
            type="button"
            aria-label="Mute alert sound"
            aria-pressed="false"
            title="Mute alert sound"
          >
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
              <path d="M2 4.5h2L7 2v8L4 7.5H2z" fill="currentColor" />
              <path
                id="mute-waves"
                d="M8.5 4a3 3 0 0 1 0 4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path
                id="mute-slash"
                d="M2 10 10 2"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                visibility="hidden"
              />
            </svg>
          </button>
          <button id="collapse" class="icon-btn" type="button" aria-label="Collapse HUD">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
              <path d="M2 5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <div class="body">
        <div class="gauge" role="img" aria-label="Camera eye contact percentage">
          <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
            <circle class="gauge-track" cx="32" cy="32" r="26" />
            <circle
              id="gauge-arc"
              class="gauge-arc"
              cx="32"
              cy="32"
              r="26"
              transform="rotate(-90 32 32)"
            />
          </svg>
          <span id="gauge-text" class="gauge-text">--</span>
        </div>

        <div class="info">
          <div class="row">
            <span id="zone-dot" class="zone-dot" aria-hidden="true"></span>
            <span id="zone-label" class="zone-label">Waiting</span>
          </div>
          <div id="timer" class="timer">0:00</div>
          <div id="presenter" class="presenter" hidden>Active presenter</div>
        </div>
      </div>

      <div id="hint" class="hint" data-level="idle" role="status" aria-live="polite">
        Waiting for camera
      </div>

      <!-- Shown only while collapsed: a small dot that expands the HUD on click, or drags it. -->
      <div id="mini" class="mini" title="Click to expand, drag to move">
        <span id="mini-dot" class="zone-dot" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="./hud.ts"></script>
  </body>
</html>
