<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teams Eye Contact Coach</title>
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body>
    <main>
      <h1>Teams Eye Contact Coach</h1>

      <section
        id="live"
        class="live"
        data-zone="none"
        data-level="idle"
        aria-label="Live eye contact"
      >
        <div class="live-top">
          <div class="gauge" role="img" aria-label="Camera eye contact percentage">
            <svg viewBox="0 0 64 64" width="132" height="132" aria-hidden="true">
              <circle class="gauge-track" cx="32" cy="32" r="26" />
              <circle
                id="gauge-arc"
                class="gauge-arc"
                cx="32"
                cy="32"
                r="26"
                transform="rotate(-90 32 32)"
              />
            </svg>
            <span id="gauge-text" class="gauge-text">--</span>
          </div>

          <div class="live-info">
            <div class="zone-row">
              <span class="zone-dot" aria-hidden="true"></span>
              <span id="zone-label" class="zone-label">Waiting</span>
            </div>
            <div id="timer" class="timer">0:00</div>
            <div id="session-state" class="muted">No session running</div>
          </div>
        </div>

        <div id="hint" class="hint" data-level="idle" role="status" aria-live="polite">
          Start a session to begin tracking
        </div>

        <div class="breakdown" aria-label="Where you looked">
          <div class="bar-row" data-zone="camera">
            <span class="bar-label">Camera</span>
            <span class="bar-track"><span id="bar-camera" class="bar-fill"></span></span>
            <span id="pct-camera" class="bar-pct">--</span>
          </div>
          <div class="bar-row" data-zone="screen">
            <span class="bar-label">Screen</span>
            <span class="bar-track"><span id="bar-screen" class="bar-fill"></span></span>
            <span id="pct-screen" class="bar-pct">--</span>
          </div>
          <div class="bar-row" data-zone="away">
            <span class="bar-label">Away</span>
            <span class="bar-track"><span id="bar-away" class="bar-fill"></span></span>
            <span id="pct-away" class="bar-pct">--</span>
          </div>
        </div>

        <button id="session-toggle" class="primary big" type="button">Start session</button>
      </section>

      <section class="next" id="next" hidden>
        <h2>Next step</h2>
        <p id="next-text"></p>
      </section>

      <ul class="status">
        <li>
          <span class="label">Calls</span>
          <span id="meeting-line"></span>
        </li>
        <li>
          <span class="label">Accuracy</span>
          <span id="calibration-line"></span>
        </li>
        <li>
          <span class="label">Dashboard</span>
          <span id="cloud-line"></span>
        </li>
      </ul>

      <div class="actions">
        <button id="calibrate" type="button">Calibrate</button>
        <button id="settings" type="button">Settings</button>
      </div>
      <p id="error" class="error" role="alert"></p>

      <p class="muted foot">
        The app keeps running in the menu bar or system tray after you close this window.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
