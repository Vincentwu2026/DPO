# electron-builder needs an exact version; Electron is hoisted to the repo root. Keep in sync with
# the "electron" version in package.json.
electronVersion: 45.3.3
appId: com.teamseyecontactcoach.app
productName: Teams Eye Contact Coach
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - '!resources/tracker/**'
  - package.json
asar: true
# Native module: its .node binary must live outside the asar to be dlopen'ed.
asarUnpack:
  - node_modules/better-sqlite3/**
# Executables cannot run from inside the asar; the PyInstaller bundle (npm run build:tracker) is
# copied next to it and resolved at runtime as process.resourcesPath/tracker/.
extraResources:
  - from: resources/tracker
    to: tracker
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Teams-Eye-Contact-Coach-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
mac:
  target:
    - target: dmg
      # The bundled tracker is built on the build machine; PyInstaller cannot cross-compile, so
      # build on an Apple Silicon Mac for arm64 (and on an Intel Mac for x64).
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signature ("-"): no Apple developer account needed. Apple Silicon refuses to run a
  # bundle with an invalid signature, so skipping signing is not an option. It is not notarized, so
  # testers must allow it once in System Settings > Privacy & Security (see the root README).
  identity: '-'
  extendInfo:
    NSCameraUsageDescription: Teams Eye Contact Coach uses your camera to measure where you look. Video is analysed in memory and never saved.
dmg:
  artifactName: Teams-Eye-Contact-Coach-${version}-${arch}.${ext}
